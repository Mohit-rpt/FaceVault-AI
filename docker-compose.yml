services:

  postgres:
    image: postgres:17
    container_name: facevault-postgres
    restart: always

    environment:
      POSTGRES_USER: facevault_admin
      POSTGRES_PASSWORD: facevault_password
      POSTGRES_DB: facevault_db

    ports:
      - "5432:5432"

    volumes:
      - facevault_data:/var/lib/postgresql/data


volumes:
  facevault_data: