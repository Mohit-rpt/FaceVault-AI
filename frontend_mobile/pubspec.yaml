name: facevault_ai
description: AI-powered face recognition & intelligence system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  http: ^1.2.1
  dio: ^5.4.1
  shared_preferences: ^2.2.2
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_riverpod: ^2.4.9
  json_annotation: ^4.8.1
  image_picker: ^1.0.7  
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  onnxruntime: ^1.2.0
  camera: ^0.10.5+9
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/models/

dependency_overrides:
  onnxruntime:
    path: packages/onnxruntime